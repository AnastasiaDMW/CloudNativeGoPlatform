apiVersion: apps/v1
kind: Deployment
metadata:
  name: go-postgres
  namespace: default
spec:
  replicas: 2
  selector:
    matchLabels:
      app: go-postgres
  template:
    metadata:
      labels:
        app: go-postgres
    spec:
      containers:
        - name: go-postgres
          image: go-postgres:dev
          imagePullPolicy: Never
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: POSTGRES_URL
              valueFrom:
                secretKeyRef:
                  name: app-db-app
                  key: uri
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
            failureThreshold: 12
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: go-postgres
  namespace: default
spec:
  selector:
    app: go-postgres
  ports:
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP
  type: ClusterIP
