receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  transform:
    log_statements:
      - context: scope
        statements:
          - set(attributes["elastic.mapping.mode"], "none")

  batch:

exporters:
  elasticsearch:
    endpoint: http://elasticsearch:9200
    logs_index: go-postgres-logs

  otlphttp/jaeger:
    endpoint: http://jaeger:4318

  debug:
    verbosity: detailed

service:
  pipelines:
    logs:
      receivers:
        - otlp
      processors:
        - transform
        - batch
      exporters:
        - elasticsearch
        - debug

    traces:
      receivers:
        - otlp
      processors:
        - batch
      exporters:
        - otlphttp/jaeger
        - debug