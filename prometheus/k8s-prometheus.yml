global:
  scrape_interval: 10s

scrape_configs:
  - job_name: "go-postgres"
    kubernetes_sd_configs:
      - role: pod
        namespaces:
          names:
            - default
    relabel_configs:
      - source_labels: [__meta_kubernetes_pod_label_app]
        action: keep
        regex: go-postgres

      - source_labels: [__meta_kubernetes_pod_container_port_name]
        action: keep
        regex: http

      - source_labels: [__meta_kubernetes_pod_name]
        target_label: pod
